# ============================================================================
#  Боевой запуск на сервере (VPS в Казахстане: hoster.kz, ps.kz, ahost.kz).
#
#  Запуск один и тот же в обоих случаях:
#      docker compose up -d --build
#
#  Режим определяется переменной SITE_ADDRESS в .env:
#      SITE_ADDRESS=:80              — показ по IP, без шифрования
#      SITE_ADDRESS=shmagro.kz       — рабочий режим, сертификат сам
#
#  ─── ЧТО ИЗМЕНИЛОСЬ ──────────────────────────────────────────────────────
#  Раньше HTTPS был необязательным профилем (`--profile tls`), а по
#  умолчанию сайт публиковался прямо на 80 порту. То есть обычный,
#  описанный в инструкции запуск отправлял пароль администратора по сети
#  открытым текстом — его читает любой на пути, от Wi-Fi в кафе до
#  провайдера. Это было отмечено в код-ревью как блокер запуска, но в код
#  так и не попало.
#
#  Теперь топология одна на все случаи: наружу смотрит только Caddy, а сам
#  сайт портов не публикует и доступен исключительно из внутренней сети
#  compose. Забыть включить шифрование больше нельзя — можно только
#  сознательно выбрать режим показа по IP.
# ============================================================================

services:
  # ------------------------------ база данных -------------------------------
  #  Второй экземпляр данных сайта. ВАЖНО понимать, чем он не является:
  #  сайт от этого контейнера не зависит. Упал, не поднялся, удалён вовсе —
  #  web продолжает работать на своём файле (см. server/db.js). Проверено
  #  испытанием: остановка базы `-m immediate` под потоком заявок не привела
  #  ни к одной потерянной заявке и ни к одной ошибке у посетителя.
  #
  #  Наружу не смотрит: ports нет сознательно, ходить в базу может только
  #  web по внутренней сети compose. Открытый в интернет 5432 — это
  #  круглосуточный перебор пароля, и он не нужен ни для чего.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shmagro}
      POSTGRES_USER: ${POSTGRES_USER:-shmagro}
      # Пароль обязателен и берётся из .env. Значения по умолчанию здесь нет
      # намеренно: с ним первый же запуск молча создал бы базу с паролем из
      # публичного репозитория.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      # scram-sha-256 вместо md5: md5 в Postgres считается устаревшим.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      PGDATA: /var/lib/postgresql/data/pgdata

    # Только внутренняя сеть. Строка подключения — postgres:5432.
    expose:
      - '5432'

    volumes:
      # ОТДЕЛЬНЫЙ том, не тот же, что у сайта. Это не мелочь: смысл второй
      # копии в том, чтобы одна беда не забрала обе. Общий том вернул бы нас
      # к одной точке отказа.
      - shm-pgdata:/var/lib/postgresql/data

    # ─── Настройка под маленький VPS ─────────────────────────────────────
    # Значения Postgres по умолчанию рассчитаны на выделенный сервер. На
    # машине с 1–2 ГБ, где рядом живут сайт и Caddy, они приводят к тому,
    # что OOM-killer убивает не базу, а что попадётся.
    command:
      - postgres
      - '-c'
      - 'max_connections=${PG_MAX_CONNECTIONS:-20}'
      - '-c'
      - 'shared_buffers=${PG_SHARED_BUFFERS:-96MB}'
      - '-c'
      - 'work_mem=4MB'
      - '-c'
      - 'maintenance_work_mem=32MB'
      - '-c'
      - 'effective_cache_size=256MB'
      # Журнал упреждающей записи не должен разрастаться на маленьком диске.
      - '-c'
      - 'max_wal_size=512MB'
      - '-c'
      - 'min_wal_size=80MB'
      # Логируем только медленные запросы и ошибки: полный лог на слабом
      # диске сам становится причиной тормозов.
      - '-c'
      - 'log_min_duration_statement=1000'

    mem_limit: ${PG_MEM_LIMIT:-384m}
    mem_reservation: 128m
    cpus: ${PG_CPUS:-0.75}
    pids_limit: 96

    security_opt:
      - no-new-privileges:true

    # Даём базе завершить контрольную точку. Убитая на середине запись —
    # это долгое восстановление при следующем старте.
    stop_grace_period: 30s

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-shmagro} -d ${POSTGRES_DB:-shmagro} -q']
      interval: 15s
      timeout: 5s
      # Первый запуск создаёт кластер — это дольше обычного старта.
      start_period: 60s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ---------------------------------- сайт ---------------------------------
  web:
    build:
      context: .
      args:
        # Абсолютный адрес сайта для og:image и JSON-LD. Задаётся в .env
        # (SITE_URL=https://ваш-домен). Пустой — остаются относительные пути.
        SITE_URL: ${SITE_URL:-}
    image: shm-agro:latest

    # Автоподъём. unless-stopped поднимает контейнер после падения процесса
    # и после перезагрузки сервера, но уважает ручную остановку: если вы
    # сами сделали docker compose stop, сам он не вернётся.
    restart: unless-stopped

    # Внутрь ставится крошечный init-процесс. Без него Node оказывается
    # первым процессом контейнера и не реагирует на сигнал остановки —
    # каждая остановка и перезапуск ждали бы таймаута в 10 секунд.
    init: true

    # ПОРТОВ НЕТ СОЗНАТЕЛЬНО. Единственная дверь снаружи — Caddy.
    # Если добавить сюда ports, сайт снова станет доступен по http в обход
    # шифрования, и вся защита выше потеряет смысл.
    expose:
      - '3001'

    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      STORE_PATH: /data/store.json
      # Загруженные из админки фотографии — на том же томе, что и данные.
      # Класть их внутрь образа нельзя: он пересоздаётся при каждом деплое,
      # и все фотографии заказчика исчезли бы после первого обновления.
      UPLOAD_DIR: /data/uploads
      # В Docker перед сайтом всегда стоит Caddy, поэтому доверять XFF здесь
      # безопасно и нужно — иначе лимиты частоты считались бы по адресу Caddy,
      # то есть общим ведром на всех.
      TRUST_PROXY: '1'
      # Потолок кучи. На VPS с 1–2 ГБ Node по умолчанию готов занять больше,
      # чем есть у машины, и процесс убивает OOM-killer — снаружи это
      # выглядит как случайное падение сайта без всяких следов в логах.
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MB:-320}
      # Порог, после которого сервер сам пишет в лог, что памяти мало.
      HEAP_WARN_MB: ${HEAP_WARN_MB:-260}

      # ─── Подключение к базе ───────────────────────────────────────────
      # postgres — имя сервиса выше во внутренней сети compose. Пусто (или
      # сервис удалён из файла) — сайт работает только на store.json, и это
      # не вызовет ни ошибки, ни предупреждения посетителю.
      DATABASE_URL: postgres://${POSTGRES_USER:-shmagro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shmagro}
      # Кто главный при расхождении файла и базы: auto | json | db.
      # auto разбирается сам — см. decideSource() в server/db.js.
      DB_SOURCE: ${DB_SOURCE:-auto}
      # Как часто память сверяется с базой, мс.
      DB_SYNC_MS: ${DB_SYNC_MS:-3000}

    # Пароль администратора, ключи ИИ и секрет сессий берутся отсюда.
    # Файл .env лежит рядом с этим файлом на сервере и в git не хранится.
    env_file:
      - .env

    # ─── Зависимость от базы — намеренно слабая ──────────────────────────
    # service_started, а НЕ service_healthy. Разница принципиальная: с
    # service_healthy больная база задерживала бы старт сайта до минуты, а
    # не поднявшаяся вовсе — не давала бы ему стартовать никогда. Сайт же
    # работоспособен без базы полностью, и ждать её ему не за чем.
    # Здесь мы просим Docker только о порядке запуска, а не об условии.
    depends_on:
      postgres:
        condition: service_started

    volumes:
      # Данные и фотографии переживают пересборку образа и перезапуск.
      - shm-data:/data

    # ─── Ограничения ресурсов ────────────────────────────────────────────
    # Без них один взбесившийся процесс забирает всю память сервера, и
    # ядро убивает не его, а что попадётся — в том числе SSH, после чего на
    # машину не зайти. С лимитом страдает только контейнер, и restart его
    # поднимает.
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    mem_reservation: 192m
    cpus: ${WEB_CPUS:-1.0}
    # Потолок числа процессов: защита от «форк-бомбы», случайной или нет.
    pids_limit: 128

    # ─── Изоляция ────────────────────────────────────────────────────────
    security_opt:
      # Запрещает повышение прав внутри контейнера (setuid-бинарники).
      - no-new-privileges:true
    cap_drop:
      # Приложению не нужна ни одна привилегия ядра: оно слушает порт выше
      # 1024 и пишет в свой каталог. Забираем всё.
      - ALL

    # Файловая система только на чтение: даже при взломе приложения некуда
    # положить закладку. Записываемыми остаются только том с данными и
    # временный каталог в памяти.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Даём процессу дописать данные по SIGTERM (см. shutdown в server/index.js).
    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ------------------------------ шифрование --------------------------------
  # Caddy сам получает и продлевает сертификат Let's Encrypt — ничего
  # настраивать и продлевать руками не нужно. Работает при двух условиях:
  # домен указывает A-записью на этот сервер, а порты 80 и 443 открыты.
  #
  # Профиля больше нет: этот сервис поднимается всегда. В режиме показа по
  # IP (SITE_ADDRESS=:80) он просто работает без шифрования, оставаясь
  # единственной точкой входа.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true

    ports:
      - '80:80'
      - '443:443'
      # QUIC/HTTP3. Отдельной строкой, потому что это UDP.
      - '443:443/udp'

    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      EMAIL: ${EMAIL:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты. Том обязателен: без него после каждого пересоздания
      # контейнера Caddy заново просит сертификат и упирается в недельный
      # лимит Let's Encrypt — сайт остаётся без HTTPS на несколько дней.
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - web

    mem_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # --------------------------------- бэкапы --------------------------------
  # Раз в сутки складывает копию данных в папку ./backups на самом сервере.
  backup:
    image: alpine:3.20
    restart: unless-stopped
    init: true

    environment:
      STORE_PATH: /data/store.json
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
      # Сколько дней хранить копии. Старше — удаляются.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Период в секундах: 86400 = раз в сутки.
      BACKUP_EVERY: ${BACKUP_EVERY:-86400}

    volumes:
      # Данные — только на чтение: бэкап не должен ничего им сделать.
      - shm-data:/data:ro
      # Копии кладём в папку рядом с проектом, чтобы их было видно на
      # сервере обычным ls и легко забрать через scp.
      - ./backups:/backups
      - ./scripts:/scripts:ro

    # Ждём, пока сайт поднимется и создаст файл данных. Без этого бэкап
    # стартовал одновременно с сайтом, не находил store.json и пропускал
    # первую копию.
    depends_on:
      web:
        condition: service_healthy

    # Первая копия делается сразу при запуске, дальше — раз в сутки.
    command: ['sh', '/scripts/backup-loop.sh']

    mem_limit: 128m
    pids_limit: 32
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

  # ---------------------------- бэкапы базы --------------------------------
  # Отдельный сервис, а не команда внутри backup: там образ alpine, в котором
  # нет pg_dump. Здесь берём тот же образ, что и сама база, — версии дампа и
  # сервера тогда гарантированно совпадают.
  #
  # Копия базы дополняет копию файла, а не заменяет её. Файл — это то, из
  # чего сайт поднимется мгновенно; дамп — то, из чего восстанавливаются
  # индексы и что можно залить в другую базу.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true

    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shmagro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-shmagro}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY: ${BACKUP_EVERY:-86400}

    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro

    # Здесь ждать здоровья базы уместно: без неё дампу просто нечего делать.
    # На сайт эта зависимость никак не влияет — он в другой ветке графа.
    depends_on:
      postgres:
        condition: service_healthy

    command: ['sh', '/scripts/pg-backup-loop.sh']

    mem_limit: 128m
    pids_limit: 32
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

  # ------------------------ восстановление из копии -------------------------
  # Сам не запускается: включается только вручную, когда данные нужно вернуть.
  #
  #     docker compose stop web
  #     docker compose run --rm restore
  #     docker compose start web
  #
  # Сайт обязательно остановить: он держит данные в памяти и, продолжая
  # работать, перезапишет восстановленный файл.
  #
  # Это отдельный сервис, а не команда в backup, потому что там данные
  # примонтированы только на чтение — восстановление в нём падало с
  # «Read-only file system».
  restore:
    image: alpine:3.20
    profiles: ['tools']
    environment:
      STORE_PATH: /data/store.json
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
    volumes:
      - shm-data:/data # на запись: сюда возвращаем данные
      - ./backups:/backups:ro # копии только читаем, портить их нечем
      - ./scripts:/scripts:ro
    command: ['sh', '/scripts/restore.sh']

  # --------------------- восстановление базы из дампа -----------------------
  # Сам не запускается. Нужен, когда потерян том с базой, а дамп остался:
  #
  #     docker compose stop web
  #     docker compose run --rm pg-restore
  #     docker compose start web
  #
  # Сайт останавливают потому, что при живом сайте полная сверка зальёт в
  # свежевосстановленную базу содержимое памяти и затрёт восстановленное.
  #
  # Если потерян том с базой, а store.json на месте — восстанавливать
  # вручную не нужно вообще: сайт увидит пустую базу и перенесёт всё сам.
  pg-restore:
    image: postgres:16-alpine
    profiles: ['tools']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shmagro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-shmagro}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:ro
      - ./scripts:/scripts:ro
    command: ['sh', '/scripts/pg-restore.sh']

volumes:
  shm-data:
  # Том базы — сознательно отдельный от shm-data. Смысл второй копии в том,
  # чтобы одна беда не забрала обе; общий том вернул бы одну точку отказа.
  shm-pgdata:
  caddy-data:
  caddy-config:
